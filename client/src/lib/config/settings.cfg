# Ultimate Sensor Monitor - Configuration File
# This file controls various application settings and behaviors

[Data]
# Enable demo data mode (true/false)
# When true: Always use demo data regardless of sensor availability
# When false: Only use real sensor data, no fallback to demo
use_demo_data=false

# Auto-create initial widgets from available sensors
auto_create_widgets=true

# Maximum number of initial widgets to create per category
max_widgets_per_category=3

[UI]
# Default edit mode on startup (view/edit)
default_edit_mode=view

# Show splash screen on startup
show_splash=true

# Auto-open left sidebar on startup
auto_open_left_sidebar=false

# Auto-open right sidebar on startup
auto_open_right_sidebar=false

[Performance]
# Widget update throttle in milliseconds (16ms = ~60fps)
widget_update_throttle=16

# Maximum number of data points for graph widgets
max_graph_points=100

# Enable hardware acceleration for animations
enable_hardware_acceleration=true

[Debug]
# Enable debug logging
debug_mode=false

# Show performance metrics
show_performance_metrics=false

# Log sensor data updates
log_sensor_updates=false

[Canvas]
# Default canvas size
default_canvas_width=1920
default_canvas_height=1080

# Default grid settings
default_grid_size=10
default_snap_to_grid=true
default_show_grid=false

[Sensors]
# Connection timeout in milliseconds
connection_timeout=5000

# Retry attempts for failed sensor connections
max_retry_attempts=3

# Update interval for real-time data in milliseconds
update_interval=1000

[Widgets]
# Default widget dimensions
default_widget_width=200
default_widget_height=200

# Minimum widget dimensions
min_widget_width=80
min_widget_height=60

# Maximum widget dimensions
max_widget_width=800
max_widget_height=600

# Default spacing between auto-created widgets
widget_spacing=250
widget_row_height=250
widgets_per_row=4 